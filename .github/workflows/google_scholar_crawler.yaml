name: Get Citation Data

on:
 schedule:
  - cron: "0 8 * * *"
 workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar data
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: yXOpclkAAAAJ

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add ./*.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
